# Loki (loki-operator, OLM), the fleet's log store in S3.
# Configuration: apps/loki/
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  source:
    repoURL: https://github.com/infrasam/openshift-app-of-apps-kustomize.git
    targetRevision: main
    path: apps/loki
  destination:
    server: https://kubernetes.default.svc
    namespace: loki
  syncPolicy:
    automated:
      # Never prune automatically: the ingesters keep unflushed logs on their volumes
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      # The operator and the objects it serves are in the same app: the objects wait
      # (retry below) until the operator has installed their types
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
