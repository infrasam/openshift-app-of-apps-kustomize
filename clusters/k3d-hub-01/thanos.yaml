# Thanos, the fleet's metrics store: receives every cluster's metrics, keeps them in S3 and
# evaluates the alert rules.
# Configuration: apps/thanos/
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: thanos
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  source:
    repoURL: https://github.com/infrasam/openshift-app-of-apps-kustomize.git
    targetRevision: main
    path: apps/thanos
  destination:
    server: https://kubernetes.default.svc
    namespace: thanos
  syncPolicy:
    automated:
      # Never prune automatically: Receive and Store keep data on their volumes
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      # The operator and the objects it serves are in the same app: the objects wait
      # (retry below) until the operator has installed their types
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
