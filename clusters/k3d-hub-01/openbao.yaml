# OpenBao, the secret store for the whole fleet: the chart, its certificate and route, the
# admin login, and the ClusterSecretStore that connects ESO to it.
# Configuration: apps/openbao/ (values.yaml = the chart's settings)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openbao
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  sources:
    # 1) The Helm chart, with the values file from this repository ($config)
    - repoURL: https://openbao.github.io/openbao-helm
      chart: openbao
      targetRevision: 0.30.0
      helm:
        releaseName: openbao
        valueFiles:
          - $config/apps/openbao/values.yaml
    # 2) This repository: the app's own YAML in apps/openbao/ (and $config for the values)
    - repoURL: https://github.com/infrasam/openshift-app-of-apps-kustomize.git
      targetRevision: main
      path: apps/openbao
      ref: config
  destination:
    server: https://kubernetes.default.svc
    namespace: openbao
  syncPolicy:
    automated:
      # Never prune the secret store automatically
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      # The operator and the objects it serves are in the same app: the objects wait
      # (retry below) until the operator has installed their types
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
