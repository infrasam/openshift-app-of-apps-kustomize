# S3 object storage (SeaweedFS) for metrics and logs, with its login from OpenBao.
# Configuration: apps/object-storage/ (values.yaml = the chart's settings)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: object-storage
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  sources:
    # 1) The Helm chart, with the values file from this repository ($config)
    - repoURL: https://seaweedfs.github.io/seaweedfs/helm
      chart: seaweedfs
      targetRevision: 4.48.0
      helm:
        releaseName: seaweedfs
        valueFiles:
          - $config/apps/object-storage/values.yaml
    # 2) This repository: the app's own YAML in apps/object-storage/ (and $config for the values)
    - repoURL: https://github.com/infrasam/openshift-app-of-apps-kustomize.git
      targetRevision: main
      path: apps/object-storage
      ref: config
  destination:
    server: https://kubernetes.default.svc
    namespace: object-storage
  syncPolicy:
    automated:
      # Never prune the storage automatically: it holds all metrics and logs
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      # The operator and the objects it serves are in the same app: the objects wait
      # (retry below) until the operator has installed their types
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
