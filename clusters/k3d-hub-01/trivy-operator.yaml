# Trivy Operator: vulnerability and configuration scanning (see apps/trivy-operator/).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trivy-operator
  namespace: openshift-gitops
  annotations:
    # After the platform foundation; nothing depends on it
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  source:
    repoURL: https://github.com/infrasam/openshift-app-of-apps-kustomize.git
    targetRevision: main
    path: apps/trivy-operator
  destination:
    # The Subscription and ConfigMap set their own namespace (operators)
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
