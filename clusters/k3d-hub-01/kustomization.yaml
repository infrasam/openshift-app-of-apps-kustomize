# Everything Argo CD installs on k3d-hub-01: one Application file per app.
# The root Application points here. Each app's configuration is in apps/<app>/.
#
# Listed in install order (the sync-wave in each file decides the actual order).
# A line starting with "# -" is an app that is in the repository but switched off.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Platform foundation
  - olm.yaml                     # -10  operator installer
  - argocd.yaml                  # -5   GitOps
  - cert-manager.yaml            # -3   certificates + lab CA
  - ingress.yaml                 # -2   Gateway API + Istio + cluster Gateway
  - external-secrets.yaml        # -1   secrets from OpenBao into Kubernetes

  # Secrets
  - openbao.yaml                 # 0    secret store for the fleet
  - vault-config-operator.yaml   # 1    managed clusters' logins in OpenBao

  # Fleet management: create, register and configure managed clusters
  - ocm.yaml                     # 0    Open Cluster Management + governance
  - capi.yaml                    # 1    Cluster API (creates the clusters)
  - policies.yaml                # 2    what every managed cluster gets
  - cluster-provisioning.yaml    # 2    one Application per managed cluster

  # Observability
  - object-storage.yaml          # 3    S3 for metrics and logs
  - thanos.yaml                  # 4    metrics store + alert rules
  - alertmanager.yaml            # 4    alert routing
  - grafana.yaml                 # 5    dashboards
  # - loki.yaml                  # 5    logs (off: not enough RAM in the lab)

  # Security
  # - trivy-operator.yaml        # 5    vulnerability scanning (off: not enough RAM in the lab)
