# vault-config-operator: manages each managed cluster's login and policy in OpenBao from
# Kubernetes objects (apps/cluster-provisioning/clusters/<cluster>/vault/).
# Configuration: apps/vault-config-operator/
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault-config-operator
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    # 1) The Helm chart, with the values file from this repository ($config)
    - repoURL: https://redhat-cop.github.io/vault-config-operator
      chart: vault-config-operator
      targetRevision: v1.0.3
      helm:
        releaseName: vault-config-operator
        valueFiles:
          - $config/apps/vault-config-operator/values.yaml
    # 2) This repository: the app's own YAML in apps/vault-config-operator/ (and $config for the values)
    - repoURL: https://github.com/infrasam/openshift-app-of-apps-kustomize.git
      targetRevision: main
      path: apps/vault-config-operator
      ref: config
  destination:
    server: https://kubernetes.default.svc
    namespace: vault-config-operator
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      # The operator and the objects it serves are in the same app: the objects wait
      # (retry below) until the operator has installed their types
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
