# Hub-only: manages OpenBao configuration from Kubernetes objects in Git (AuthEngineMount,
# KubernetesAuthEngineConfig, KubernetesAuthEngineRole, Policy). Each managed cluster's folder
# describes its own access to OpenBao, so a new cluster gets it without manual steps.
# It logs in to OpenBao with the role "vault-config" from OpenBao's self-initialization.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault-config-operator
  namespace: openshift-gitops
  annotations:
    # After vault-config-operator-config (1): the namespace and the CA must exist
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  sources:
    # 1) The Helm chart
    - repoURL: https://redhat-cop.github.io/vault-config-operator
      chart: vault-config-operator
      targetRevision: v1.0.3
      helm:
        releaseName: vault-config-operator
        valueFiles:
          - $config/apps/vault-config-operator/values.yaml
    # 2) This repository: where the values file comes from ($config above)
    - repoURL: https://github.com/infrasam/openshift-app-of-apps-kustomize.git
      targetRevision: main
      ref: config
  destination:
    server: https://kubernetes.default.svc
    namespace: vault-config-operator
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
