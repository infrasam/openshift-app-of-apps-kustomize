# Hub-only: the policy engine on the hub (ACM upstream). Brings the Policy, PlacementBinding,
# PolicySet and PolicyAutomation types, and copies each Policy to the namespaces of the clusters
# its Placement selects.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: governance-propagator
  namespace: openshift-gitops
  annotations:
    # After ocm-hub (0): needs the Placement API
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    # 1) The Helm chart
    - repoURL: https://open-cluster-management.io/helm-charts
      chart: governance-policy-propagator
      targetRevision: 0.20.1
      helm:
        releaseName: governance-policy-propagator
        valueFiles:
          - $config/apps/governance-propagator/values.yaml
    # 2) This repository: where the values file comes from ($config above)
    - repoURL: https://github.com/infrasam/openshift-app-of-apps-kustomize.git
      targetRevision: main
      ref: config
  destination:
    server: https://kubernetes.default.svc
    namespace: open-cluster-management
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
