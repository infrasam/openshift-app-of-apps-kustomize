# External Secrets Operator on every cluster: turns ExternalSecret objects into Secrets,
# with the values fetched from OpenBao.
# Helm instead of OLM on purpose: the operatorhubio package is stuck at v0.11 with the old
# v1beta1 API.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: openshift-gitops
  annotations:
    # After cert-manager (-3) and lab-ca (-2), before anything that consumes secrets
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  sources:
    # 1) The Helm chart
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 2.11.0
      helm:
        valueFiles:
          - $config/apps/external-secrets/values.yaml
    # 2) This repository: where the values file comes from ($config above)
    - repoURL: https://github.com/infrasam/openshift-app-of-apps-kustomize.git
      targetRevision: main
      ref: config
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The CRDs are too large for client-side apply
      - ServerSideApply=true
