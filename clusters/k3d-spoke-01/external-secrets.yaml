# External Secrets Operator and its connection to the hub's OpenBao.
# Configuration: apps/external-secrets/ (values.yaml, shared with the hub) and
# apps/external-secrets/k3d-spoke-01/ (this cluster's connection)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  sources:
    # 1) The Helm chart, with the values file from this repository ($config)
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 2.11.0
      helm:
        valueFiles:
          - $config/apps/external-secrets/values.yaml
    # 2) This repository: the app's own YAML in apps/external-secrets/k3d-spoke-01/ (and $config for the values)
    - repoURL: https://github.com/infrasam/openshift-app-of-apps-kustomize.git
      targetRevision: main
      path: apps/external-secrets/k3d-spoke-01
      ref: config
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # The operator and the objects it serves are in the same app: the objects wait
      # (retry below) until the operator has installed their types
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
