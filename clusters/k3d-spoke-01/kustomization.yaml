# Everything Argo CD installs on k3d-spoke-01: one Application file per app.
# The spoke's root Application (created by the hub's "gitops" policy) points here.
# Each app's configuration is in apps/<app>/.
#
# Listed in install order (the sync-wave in each file decides the actual order).
# A line starting with "# -" is an app that is in the repository but switched off.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - cert-manager.yaml            # -3   certificates + lab CA
  - external-secrets.yaml        # -1   secrets from the hub's OpenBao
  - prometheus.yaml              # 1    metrics, sent to the hub's Thanos
  # - opentelemetry-collector.yaml  # 1 logs, sent to the hub's Loki (off: Loki is off)
