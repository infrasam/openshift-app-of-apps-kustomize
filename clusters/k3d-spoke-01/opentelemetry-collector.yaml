# Log collector (opentelemetry-operator, OLM) on every node; sends this cluster's logs to
# the hub's Loki.
# Configuration: apps/opentelemetry-collector/k3d-spoke-01/
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opentelemetry-collector
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/infrasam/openshift-app-of-apps-kustomize.git
    targetRevision: main
    path: apps/opentelemetry-collector/k3d-spoke-01
  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      # The operator and the objects it serves are in the same app: the objects wait
      # (retry below) until the operator has installed their types
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
