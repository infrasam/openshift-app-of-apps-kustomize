# OpenBao may read namespace labels: the "vault-config" role (self-initialization) accepts
# logins from any namespace labelled platform.example.internal/managed-cluster=true.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openbao-namespace-reader
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openbao-namespace-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: openbao-namespace-reader
subjects:
  - kind: ServiceAccount
    name: openbao
    namespace: openbao
