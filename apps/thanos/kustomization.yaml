apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - objstore.yaml
  - receive.yaml
  - store.yaml
  - query.yaml
  - compactor.yaml
  - ruler.yaml
  - httproute.yaml
# The alert rules as a ConfigMap. Its name gets a hash of the content, so the Ruler restarts
# with the new rules whenever a rule file changes.
configMapGenerator:
  - name: thanos-rules
    namespace: thanos
    files:
      - rules/fleet.yaml
