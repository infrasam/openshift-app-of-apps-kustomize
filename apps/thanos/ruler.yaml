# Thanos Ruler: evaluates the alert rules (rules-fleet.yaml) against Thanos Query, so one rule
# covers every cluster, and sends firing alerts to Alertmanager (apps/alertmanager/).
apiVersion: v1
kind: Service
metadata:
  name: thanos-ruler
  namespace: thanos
spec:
  # Headless: Query finds the Ruler through DNS and reads the ALERTS series from it
  clusterIP: None
  selector:
    app.kubernetes.io/name: thanos-ruler
  ports:
    - name: grpc
      port: 10901
    - name: http
      port: 10902
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: thanos-ruler
  namespace: thanos
spec:
  serviceName: thanos-ruler
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: thanos-ruler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: thanos-ruler
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: thanos
          image: quay.io/thanos/thanos:v0.42.4
          args:
            - rule
            - --grpc-address=0.0.0.0:10901
            - --http-address=0.0.0.0:10902
            - --data-dir=/var/thanos/ruler
            - --rule-file=/etc/thanos/rules/*.yaml
            - --eval-interval=30s
            # Rule results are kept locally only; nothing to upload to S3 for alerts
            - --tsdb.retention=24h
            - --query=dnssrv+_http._tcp.thanos-query.thanos.svc.cluster.local
            # The scheme is required here (unlike --query above)
            - --alertmanagers.url=dnssrv+http://_web._tcp.alertmanager-operated.alertmanager.svc.cluster.local
            # Tells the replicas apart; dropped from the alerts themselves
            - --label=thanos_ruler_replica="$(POD_NAME)"
            - --alert.label-drop=thanos_ruler_replica
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: grpc
              containerPort: 10901
            - name: http
              containerPort: 10902
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /var/thanos/ruler
            - name: rules
              mountPath: /etc/thanos/rules
              readOnly: true
      volumes:
        - name: rules
          configMap:
            name: thanos-rules
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
