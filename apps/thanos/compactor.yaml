# Thanos Compactor: merges small blocks in S3 into bigger ones, makes downsampled
# copies (5m and 1h resolution) for long time ranges and deletes data past retention.
# Exactly ONE compactor per bucket, never more.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: thanos-compactor
  namespace: thanos
spec:
  serviceName: thanos-compactor
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: thanos-compactor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: thanos-compactor
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: thanos
          image: quay.io/thanos/thanos:v0.42.4
          args:
            - compact
            # Keep running and compact continuously, instead of once and exit
            - --wait
            - --http-address=0.0.0.0:10902
            - --data-dir=/var/thanos/compact
            - --objstore.config-file=/etc/thanos/objstore.yml
            - --deduplication.replica-label=receive_replica
            # Lab retention. RHACM Observability defaults: raw 365d, 5m 365d, 1h 365d.
            - --retention.resolution-raw=14d
            - --retention.resolution-5m=30d
            - --retention.resolution-1h=90d
          ports:
            - name: http
              containerPort: 10902
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/thanos/compact
            - name: objstore
              mountPath: /etc/thanos
              readOnly: true
      volumes:
        - name: objstore
          secret:
            secretName: thanos-objstore
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi
