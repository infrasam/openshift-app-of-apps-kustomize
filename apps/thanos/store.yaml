# Thanos Store: serves the blocks in S3 to Query (everything Receive has uploaded).
# Its volume is only a cache of index data; it can be thrown away at any time.
apiVersion: v1
kind: Service
metadata:
  name: thanos-store
  namespace: thanos
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: thanos-store
  ports:
    - name: grpc
      port: 10901
    - name: http
      port: 10902
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: thanos-store
  namespace: thanos
spec:
  serviceName: thanos-store
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: thanos-store
  template:
    metadata:
      labels:
        app.kubernetes.io/name: thanos-store
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: thanos
          image: quay.io/thanos/thanos:v0.42.4
          args:
            - store
            - --grpc-address=0.0.0.0:10901
            - --http-address=0.0.0.0:10902
            - --data-dir=/var/thanos/store
            - --objstore.config-file=/etc/thanos/objstore.yml
          ports:
            - name: grpc
              containerPort: 10901
            - name: http
              containerPort: 10902
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /var/thanos/store
            - name: objstore
              mountPath: /etc/thanos
              readOnly: true
      volumes:
        - name: objstore
          secret:
            secretName: thanos-objstore
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
