# Every plain-HTTP request is redirected to HTTPS (OpenShift Route: insecureEdgeTerminationPolicy: Redirect).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https
  namespace: openshift-ingress
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  parentRefs:
    - name: apps
      sectionName: http
  hostnames:
    - "*.apps.hub.172.19.0.3.nip.io"
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
