# Sail Operator (upstream of OpenShift Service Mesh 3): runs Istio, which implements
# Gateway API for ingress.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: sailoperator
  # AllNamespaces-only operator
  namespace: operators
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  name: sailoperator
  # Minor-pinned channel: moving to the next Istio minor is a deliberate change
  channel: stable-1.30
  source: operatorhubio-catalog
  sourceNamespace: olm
  startingCSV: sailoperator.v1.30.4
  # TODO: Manual approval so upgrades are deliberate, not automatic
  installPlanApproval: Automatic
