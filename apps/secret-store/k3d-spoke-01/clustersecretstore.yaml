# Connects this cluster's ESO to the hub's OpenBao, through the hub's Gateway (TLS passthrough).
# It logs in on the cluster's own login path and may only read shared/* and clusters/k3d-spoke-01/*.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: https://openbao.apps.hub.172.19.0.3.nip.io
      path: secret
      version: v2
      caProvider:
        type: ConfigMap
        name: hub-ca
        namespace: external-secrets
        key: ca.crt
      auth:
        kubernetes:
          mountPath: spokes/k3d-spoke-01
          role: eso
          serviceAccountRef:
            name: openbao-auth
            namespace: external-secrets
