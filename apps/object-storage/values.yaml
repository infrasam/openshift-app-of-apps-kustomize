# Helm values for the "seaweedfs" chart.
# Used by: clusters/k3d-hub-01/object-storage.yaml

# All-in-one: master, volume, filer and S3 in one pod
master:
  enabled: false
volume:
  enabled: false
filer:
  enabled: false
allInOne:
  enabled: true
  s3:
    enabled: true
    # Login from object-storage/s3-config.yaml (OpenBao via ESO)
    enableAuth: true
    existingConfigSecret: s3-config
    createBuckets:
      - name: thanos
      - name: loki
  data:
    type: persistentVolumeClaim
    size: 10Gi
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
