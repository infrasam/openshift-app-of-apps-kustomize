# grafana-operator via OLM: Grafana, its data sources and dashboards as Kubernetes objects
# (apps/grafana/). Lab: upstream package from operatorhubio-catalog, channel v5.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: grafana-operator
  # Watches all namespaces: "operators" already has a global OperatorGroup
  namespace: operators
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  name: grafana-operator
  channel: v5
  source: operatorhubio-catalog
  sourceNamespace: olm
  startingCSV: grafana-operator.v5.24.0
  # TODO: Manual approval so upgrades are deliberate, not automatic
  installPlanApproval: Automatic
