# One Application per folder in apps/cluster-provisioning/clusters/: each creates and registers one cluster.
# New cluster = new folder in a PR; nothing on the hub needs to change.
# Scoped to THIS hub's folder, so a second hub never picks up clusters it does not own.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: spoke-provisioning
  namespace: openshift-gitops
spec:
  goTemplate: true
  # Fail on typos in template variables instead of rendering empty strings
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/infrasam/openshift-app-of-apps-kustomize.git
        revision: main
        directories:
          - path: apps/cluster-provisioning/clusters/*
  template:
    metadata:
      # The folder name is the cluster name: clusters/k3d-spoke-01 -> k3d-spoke-01
      name: '{{ .path.basename }}-provisioning'
    spec:
      project: default
      source:
        repoURL: https://github.com/infrasam/openshift-app-of-apps-kustomize.git
        targetRevision: main
        path: '{{ .path.path }}'
      destination:
        # The HUB: the manifests set their own namespace (namespace.yaml)
        server: https://kubernetes.default.svc
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
  syncPolicy:
    # Deleting the ApplicationSet (or a folder) must never delete a running cluster
    preserveResourcesOnDeletion: true
