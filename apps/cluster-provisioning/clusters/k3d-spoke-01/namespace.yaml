# Each managed cluster gets its own namespace on the HUB, named after the cluster
# (same convention as ACM/Hive). The label opts it in to the shared credentials
# (apps/cluster-provisioning/pull-secret.yaml).
apiVersion: v1
kind: Namespace
metadata:
  name: k3d-spoke-01
  labels:
    platform.example.internal/managed-cluster: "true"
