# Registers the spoke in OCM. Same name as the CAPI Cluster and its namespace, so the
# ClusterImporter finds k3d-spoke-01/k3d-spoke-01-kubeconfig and installs the klusterlet.
apiVersion: cluster.open-cluster-management.io/v1
kind: ManagedCluster
metadata:
  name: k3d-spoke-01
  labels:
    # Gets its own Argo CD and root app from the hub's "gitops" policy (apps/policies/)
    gitops: "true"
  annotations:
    # Never let Argo CD remove the registration (in ACM this can tear down the cluster)
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  # The hub accepts this cluster; its join request (CSR) is auto-approved
  hubAcceptsClient: true
