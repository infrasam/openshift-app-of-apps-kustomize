# prometheus-operator via OLM: runs this cluster's Prometheus (prometheus.yaml) and turns the
# ServiceMonitors into scrape configuration.
# Lab: upstream package "prometheus" from operatorhubio-catalog (beta, v0.70.0).
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: prometheus
  # Watches all namespaces: "operators" already has a global OperatorGroup
  namespace: operators
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  name: prometheus
  channel: beta
  source: operatorhubio-catalog
  sourceNamespace: olm
  startingCSV: prometheusoperator.v0.70.0
  # TODO: Manual approval so upgrades are deliberate, not automatic
  installPlanApproval: Automatic
