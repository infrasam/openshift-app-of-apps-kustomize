# prometheus-operator via OLM. On the hub it only runs the alerting pieces:
# ThanosRuler (evaluates alert rules against Thanos Query) and Alertmanager (apps/alerting/).
# Lab: upstream package "prometheus" from operatorhubio-catalog (beta, v0.70.0).
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: prometheus
  # Watches all namespaces: "operators" already has a global OperatorGroup
  namespace: operators
spec:
  name: prometheus
  channel: beta
  source: operatorhubio-catalog
  sourceNamespace: olm
  startingCSV: prometheusoperator.v0.70.0
  # TODO: Manual approval so upgrades are deliberate, not automatic
  installPlanApproval: Automatic
