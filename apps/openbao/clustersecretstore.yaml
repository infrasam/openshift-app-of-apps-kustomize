# Connects ESO to OpenBao for the whole cluster (every namespace can use it).
# Wave 1 of this app: it can only turn healthy once OpenBao runs.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  provider:
    vault:
      # Inside the hub: straight to the Raft leader
      server: https://openbao-active.openbao.svc:8200
      # KV version 2 mounted at secret/ (self-initialization in apps/openbao/values.yaml)
      path: secret
      version: v2
      # Trust OpenBao's certificate: the lab-ca root, from the certificate secret
      caProvider:
        type: Secret
        name: openbao-tls
        namespace: openbao
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso-k3d-hub-01
          serviceAccountRef:
            name: openbao-auth
            namespace: external-secrets
