# loki-operator via OLM: runs LokiStack, the log store (apps/loki/).
# Lab: upstream package from operatorhubio-catalog (alpha, v0.12.0, Loki 3.7).
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: loki-operator
  # AllNamespaces-only operator: "operators" already has a global OperatorGroup
  namespace: operators
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  name: loki-operator
  channel: alpha
  source: operatorhubio-catalog
  sourceNamespace: olm
  startingCSV: loki-operator.v0.12.0
  # TODO: Manual approval so upgrades are deliberate, not automatic
  installPlanApproval: Automatic
