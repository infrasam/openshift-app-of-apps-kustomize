# Runs on every pull request: every folder with a kustomization.yaml must render, and every
# object must match its schema. A broken file is stopped before it reaches main and Argo CD.
# Production: the same two commands in the internal CI (e.g. GitLab CI), with mirrored schemas.
name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform

      - name: Render and validate every kustomization
        run: |
          fail=0
          # Helm charts under helm/ are rendered by Argo CD with cluster values, not here
          for dir in $(find cluster -name kustomization.yaml -not -path '*/helm/*' -exec dirname {} \; | sort); do
            echo "::group::$dir"
            if ! kubectl kustomize "$dir" > /tmp/rendered.yaml; then
              echo "::error::$dir does not render"; fail=1; echo "::endgroup::"; continue
            fi
            # ClusterManager: the public schema is older than the OCM version we run
            kubeconform -strict -summary -ignore-missing-schemas \
              -skip ClusterManager \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
              /tmp/rendered.yaml || { echo "::error::$dir has invalid objects"; fail=1; }
            echo "::endgroup::"
          done
          exit $fail
