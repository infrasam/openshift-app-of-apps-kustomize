# Applied to the HUB: how k3d-spoke-01 is created.
# Not referenced by the spoke's own kustomization.yaml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - cluster.yaml
  - controlplane.yaml
  - cni.yaml
  - managedcluster.yaml
configMapGenerator:
  - name: cni-kindnet
    namespace: k3d-spoke-01
    files:
      - cni/kindnet.yaml
generatorOptions:
  disableNameSuffixHash: true
