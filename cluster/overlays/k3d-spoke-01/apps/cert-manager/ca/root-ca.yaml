# The lab's root CA. Production equivalent: the corporate root (ADCS / Vault PKI),
# which is never created inside a cluster.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: lab-root-ca
  # Must be cert-manager's cluster resource namespace, where CA ClusterIssuers
  # read their secret. OLM install: "operators" (Red Hat operator: "cert-manager").
  namespace: operators
spec:
  isCA: true
  commonName: Lab Root CA
  subject:
    organizations:
      - infrasam lab
  secretName: lab-root-ca
  duration: 87600h   # 10 years
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: selfsigned
