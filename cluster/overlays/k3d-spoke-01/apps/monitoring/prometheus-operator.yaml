# Application: prometheus-operator, installed by OLM from ./operator. Early (wave -3),
# beside cert-manager: nothing else depends on it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-operator
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: default
  source:
    repoURL: https://github.com/infrasam/openshift-app-of-apps-kustomize.git
    targetRevision: main
    path: cluster/overlays/k3d-spoke-01/apps/monitoring/operator
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
