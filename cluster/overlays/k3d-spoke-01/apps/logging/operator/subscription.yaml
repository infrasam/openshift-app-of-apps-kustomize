# opentelemetry-operator via OLM, the same way OpenShift installs operators from OperatorHub.
# Lab: upstream package from operatorhubio-catalog (alpha, v0.160.0).
# Production equivalent: "opentelemetry-product" from redhat-operators
# (Red Hat build of OpenTelemetry), or cluster-logging (see ../kustomization.yaml).
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: opentelemetry-operator
  # AllNamespaces-only operator: "operators" already has a global OperatorGroup
  # (production: openshift-operators)
  namespace: operators
spec:
  name: opentelemetry-operator
  channel: alpha
  source: operatorhubio-catalog
  sourceNamespace: olm
  startingCSV: opentelemetry-operator.v0.160.0
  # TODO(prod): Manual approval so upgrades are deliberate, not automatic
  installPlanApproval: Automatic
