# ESO logs in to the hub's OpenBao as this ServiceAccount (role "eso" on auth/spokes/k3d-spoke-01,
# created from managed-clusters/k3d-spoke-01/vault/ on the hub).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-auth
  namespace: external-secrets
---
# OpenBao checks the login token by sending it to this cluster's TokenReview API, using the token
# itself (no stored reviewer token). That needs system:auth-delegator.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openbao-auth-token-review
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: openbao-auth
    namespace: external-secrets
