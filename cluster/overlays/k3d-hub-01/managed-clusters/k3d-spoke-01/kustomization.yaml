# Applied to the HUB: how k3d-spoke-01 is created and registered.
# Rendered by the spoke-provisioning ApplicationSet, not by the hub's own kustomization.yaml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - cluster.yaml
  - controlplane.yaml
  - cni.yaml
  - olm.yaml
  - managedcluster.yaml
  - governance-addons.yaml
  - vault
  - import-rbac.yaml
configMapGenerator:
  - name: cni-kindnet
    namespace: k3d-spoke-01
    files:
      - cni/kindnet.yaml
  # OLM in three ConfigMaps (max 1 MiB each), applied in order by olm.yaml
  - name: olm-crd-clusterserviceversions
    namespace: k3d-spoke-01
    files:
      - olm/crd-clusterserviceversions.yaml
  - name: olm-crds
    namespace: k3d-spoke-01
    files:
      - olm/crds.yaml
  - name: olm
    namespace: k3d-spoke-01
    files:
      - olm/olm.yaml
generatorOptions:
  disableNameSuffixHash: true
