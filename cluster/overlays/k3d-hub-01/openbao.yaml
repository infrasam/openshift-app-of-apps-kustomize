# Hub-only: OpenBao, the one secret store for the whole fleet (production: the corporate Vault),
# and the ESO connection to it. Chart: cluster/applications/openbao (wrapper around the
# upstream openbao chart; Argo CD downloads the dependency when it renders).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openbao
  namespace: openshift-gitops
  annotations:
    # After lab-ca (-2), external-secrets (-1) and ingress (0)
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/infrasam/openshift-app-of-apps-kustomize.git
    targetRevision: main
    path: cluster/applications/openbao
    helm:
      releaseName: openbao
  destination:
    server: https://kubernetes.default.svc
    namespace: openbao
  syncPolicy:
    automated:
      # Never prune anything of the secret store automatically
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
