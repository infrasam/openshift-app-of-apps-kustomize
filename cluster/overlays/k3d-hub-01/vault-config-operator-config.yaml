# Hub-only: what vault-config-operator needs before it starts: its namespace and the CA it uses
# to trust OpenBao (see applications/vault-config-operator/).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault-config-operator-config
  namespace: openshift-gitops
  annotations:
    # After lab-ca (-2)
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/infrasam/openshift-app-of-apps-kustomize.git
    targetRevision: main
    path: cluster/applications/vault-config-operator
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
