# Demo of the ESO -> OpenBao flow. Remove when no longer needed.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secret-demo
  namespace: openshift-gitops
  annotations:
    # After secret-store (2)
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/infrasam/openshift-app-of-apps-kustomize.git
    targetRevision: main
    path: cluster/applications/secret-demo
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
