# Hub-only: Keycloak, the platform's identity provider (see applications/keycloak/).
# Lab: stands in for the company's directory (AD / Entra ID). Argo CD, Grafana and OpenBao
# log in against it with OIDC; group membership decides what each person may do.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak
  namespace: openshift-gitops
  annotations:
    # After cloudnative-pg and keycloak-operator (5)
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: default
  source:
    repoURL: https://github.com/infrasam/openshift-app-of-apps-kustomize.git
    targetRevision: main
    path: cluster/applications/keycloak
  destination:
    server: https://kubernetes.default.svc
    namespace: keycloak
  syncPolicy:
    automated:
      # Never prune automatically: the database holds every user and session
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
