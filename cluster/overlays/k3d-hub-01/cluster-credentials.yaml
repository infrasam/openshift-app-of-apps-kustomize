# Hub-only: credentials every spoke namespace on the hub gets, defined once
# (see applications/cluster-credentials/).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-credentials
  namespace: openshift-gitops
  annotations:
    # After secret-store (2), which provides the ClusterSecretStore
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/infrasam/openshift-app-of-apps-kustomize.git
    targetRevision: main
    path: cluster/applications/cluster-credentials
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
