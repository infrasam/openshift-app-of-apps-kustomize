apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: infra
  namespace: {{ .Values.argocdNamespace }}
spec:
  description: App-of-apps layer for {{ .Values.cluster }}
  sourceRepos:
    - {{ .Values.repoURL }}
  destinations:
    - server: https://kubernetes.default.svc
      namespace: {{ .Values.argocdNamespace }}
  # The infra layer may only create Argo CD objects, nothing else
  namespaceResourceWhitelist:
    - group: argoproj.io
      kind: Application
    # Hub: generates one Application per spoke (cluster provisioning)
    - group: argoproj.io
      kind: ApplicationSet
