# Hub-only: S3 object storage for metrics and logs (see applications/object-storage/).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: object-storage
  namespace: openshift-gitops
  annotations:
    # After minio-operator (1) and secret-store (2)
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/infrasam/openshift-app-of-apps-kustomize.git
    targetRevision: main
    path: cluster/applications/object-storage
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      # Never prune the storage automatically: it holds all metrics and logs
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
