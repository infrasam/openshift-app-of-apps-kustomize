# Hub-only: the ESO connection to OpenBao (ServiceAccount + ClusterSecretStore).
# A separate Application after OpenBao: the store only turns healthy once OpenBao runs, and
# a sync wave waits until everything before it is healthy.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secret-store
  namespace: openshift-gitops
  annotations:
    # After openbao (1)
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/infrasam/openshift-app-of-apps-kustomize.git
    targetRevision: main
    path: cluster/applications/secret-store
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
