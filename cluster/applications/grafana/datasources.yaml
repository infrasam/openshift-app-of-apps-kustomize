# Where Grafana reads from: Thanos Query (metrics from every cluster), Alertmanager
# (the alerts from applications/alerting/) and Loki (logs, at the bottom).
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: thanos
  namespace: grafana
spec:
  instanceSelector:
    matchLabels:
      grafana: hub
  datasource:
    name: Thanos
    uid: thanos
    type: prometheus
    access: proxy
    url: http://thanos-query.thanos.svc:9090
    isDefault: true
    jsonData:
      timeInterval: 30s
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: alertmanager
  namespace: grafana
spec:
  instanceSelector:
    matchLabels:
      grafana: hub
  datasource:
    name: Alertmanager
    uid: alertmanager
    type: alertmanager
    access: proxy
    url: http://alertmanager-operated.thanos.svc:9093
    jsonData:
      implementation: prometheus
---
# Logs from every cluster (applications/loki/), tenant "fleet"
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: loki
  namespace: grafana
spec:
  instanceSelector:
    matchLabels:
      grafana: hub
  datasource:
    name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://logs-query-frontend-http.loki.svc:3100
    jsonData:
      httpHeaderName1: X-Scope-OrgID
    secureJsonData:
      httpHeaderValue1: fleet
