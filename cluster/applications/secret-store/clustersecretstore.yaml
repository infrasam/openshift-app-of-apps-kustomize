# Connects ESO to OpenBao for the whole cluster (every namespace can use it).
# Its own Application (secret-store, wave 2): it can only turn healthy once OpenBao runs.
# Production: the same object pointing at the corporate Vault.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
  annotations:
    # The CRD comes from external-secrets (wave -1); on a fresh cluster skip the dry-run
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    vault:
      # Inside the hub: straight to the Raft leader
      server: https://openbao-active.openbao.svc:8200
      # KV version 2 mounted at secret/ (self-initialization in overlays/k3d-hub-01/openbao.yaml)
      path: secret
      version: v2
      # Trust OpenBao's certificate: the lab-ca root, from the certificate secret
      caProvider:
        type: Secret
        name: openbao-tls
        namespace: openbao
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso-k3d-hub-01
          serviceAccountRef:
            name: openbao-auth
            namespace: external-secrets
