# prometheus-operator via OLM. On the hub it only runs the alerting pieces:
# ThanosRuler (evaluates alert rules against Thanos Query) and Alertmanager (applications/alerting/).
# Lab: upstream package "prometheus" from operatorhubio-catalog (beta, v0.70.0).
# Production: RHACM Observability runs its own Thanos Ruler and Alertmanager on the hub.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: prometheus
  # Watches all namespaces: "operators" already has a global OperatorGroup
  # (production: openshift-operators)
  namespace: operators
spec:
  name: prometheus
  channel: beta
  source: operatorhubio-catalog
  sourceNamespace: olm
  startingCSV: prometheusoperator.v0.70.0
  # TODO(prod): Manual approval so upgrades are deliberate, not automatic
  installPlanApproval: Automatic
