# Argo CD UI through the cluster Gateway (OpenShift: the openshift-gitops-server Route).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-server
  namespace: openshift-gitops
spec:
  parentRefs:
    - name: apps
      namespace: openshift-ingress
      sectionName: https
  hostnames:
    - argocd.apps.hub.127.0.0.1.nip.io
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
