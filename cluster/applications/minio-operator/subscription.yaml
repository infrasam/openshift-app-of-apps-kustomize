# MinIO operator via OLM: runs S3 object storage (Tenants) inside the cluster.
# Object storage for metrics (Thanos) and logs (Loki).
# Production equivalent: OpenShift Data Foundation (Multicloud Object Gateway) or an external S3.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: minio-operator
  # AllNamespaces-only operator: "operators" already has a global OperatorGroup
  namespace: operators
spec:
  name: minio-operator
  channel: stable
  source: operatorhubio-catalog
  sourceNamespace: olm
  startingCSV: minio-operator.v5.0.3
  # TODO(prod): Manual approval so upgrades are deliberate, not automatic
  installPlanApproval: Automatic
