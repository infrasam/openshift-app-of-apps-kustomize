# Thanos Query: one PromQL API over the whole fleet. Asks Receive (recent data) and
# Store (S3) and merges the answers. Grafana and Thanos Ruler will query here.
apiVersion: v1
kind: Service
metadata:
  name: thanos-query
  namespace: thanos
spec:
  selector:
    app.kubernetes.io/name: thanos-query
  ports:
    - name: http
      port: 9090
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: thanos-query
  namespace: thanos
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: thanos-query
  template:
    metadata:
      labels:
        app.kubernetes.io/name: thanos-query
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: thanos
          image: quay.io/thanos/thanos:v0.42.4
          args:
            - query
            - --grpc-address=0.0.0.0:10901
            - --http-address=0.0.0.0:10902
            # Every pod behind the headless Services, found through DNS
            - --endpoint=dnssrv+_grpc._tcp.thanos-receive.thanos.svc.cluster.local
            - --endpoint=dnssrv+_grpc._tcp.thanos-store.thanos.svc.cluster.local
            # Same series from several Receive replicas: show it once
            - --query.replica-label=receive_replica
          ports:
            - name: grpc
              containerPort: 10901
            - name: http
              containerPort: 10902
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
