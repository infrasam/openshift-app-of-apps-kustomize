# Thanos Receive: takes remote_write from every cluster's Prometheus, keeps the newest
# data on its own volume and uploads a block to S3 every two hours.
# Lab: 1 replica. Production: 3 replicas with a hashring and replication factor 3.
apiVersion: v1
kind: Service
metadata:
  name: thanos-receive
  namespace: thanos
spec:
  # Headless: Query finds every Receive pod through DNS (SRV records)
  clusterIP: None
  selector:
    app.kubernetes.io/name: thanos-receive
  ports:
    - name: grpc
      port: 10901
    - name: http
      port: 10902
    - name: remote-write
      port: 19291
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: thanos-receive
  namespace: thanos
spec:
  serviceName: thanos-receive
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: thanos-receive
  template:
    metadata:
      labels:
        app.kubernetes.io/name: thanos-receive
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: thanos
          image: quay.io/thanos/thanos:v0.42.4
          args:
            - receive
            - --grpc-address=0.0.0.0:10901
            - --http-address=0.0.0.0:10902
            - --remote-write.address=0.0.0.0:19291
            - --tsdb.path=/var/thanos/receive
            # Local copy; everything older is read from S3 by Store
            - --tsdb.retention=1d
            - --objstore.config-file=/etc/thanos/objstore.yml
            # Tells the replicas apart, so Query can remove duplicates
            - --label=receive_replica="$(POD_NAME)"
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: grpc
              containerPort: 10901
            - name: http
              containerPort: 10902
            - name: remote-write
              containerPort: 19291
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/thanos/receive
            - name: objstore
              mountPath: /etc/thanos
              readOnly: true
      volumes:
        - name: objstore
          secret:
            secretName: thanos-objstore
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
