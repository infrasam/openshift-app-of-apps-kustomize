# Keycloak operator via OLM: the identity provider for the platform (applications/keycloak/).
# Lab: upstream package from operatorhubio-catalog. Production: "rhbk-operator"
# (Red Hat build of Keycloak) from redhat-operators - or no Keycloak at all, when the
# applications log in against the company's AD/Entra ID directly.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: keycloak-operator
  # Watches all namespaces: "operators" already has a global OperatorGroup
  # (production: openshift-operators)
  namespace: operators
spec:
  name: keycloak-operator
  channel: fast
  source: operatorhubio-catalog
  sourceNamespace: olm
  startingCSV: keycloak-operator.v26.8.0
  # TODO(prod): Manual approval so upgrades are deliberate, not automatic
  installPlanApproval: Automatic
