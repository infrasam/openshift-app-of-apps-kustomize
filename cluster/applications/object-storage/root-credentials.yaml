# MinIO's root login, from OpenBao (clusters/k3d-hub-01/minio), never from Git.
# MinIO reads it as an env file: config.env.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: s3-env
  namespace: object-storage
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: s3-env
    template:
      data:
        config.env: |
          export MINIO_ROOT_USER="{{ .root_user }}"
          export MINIO_ROOT_PASSWORD="{{ .root_password }}"
  dataFrom:
    - extract:
        key: clusters/k3d-hub-01/minio
