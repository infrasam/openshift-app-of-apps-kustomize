# The S3 login for SeaweedFS, from OpenBao (clusters/k3d-hub-01/s3), never from Git.
# SeaweedFS reads the identities as JSON (key seaweedfs_s3_config).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: s3-config
  namespace: object-storage
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: s3-config
    template:
      data:
        seaweedfs_s3_config: |
          {"identities":[{"name":"admin","credentials":[{"accessKey":"{{ .access_key }}","secretKey":"{{ .secret_key }}"}],"actions":["Admin","Read","List","Tagging","Write"]}]}
  dataFrom:
    - extract:
        key: clusters/k3d-hub-01/s3
