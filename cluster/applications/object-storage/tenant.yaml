# S3 object storage for the fleet's metrics (bucket "thanos") and logs (bucket "loki").
# Production equivalent: OpenShift Data Foundation (Multicloud Object Gateway) or an external S3.
apiVersion: minio.min.io/v2
kind: Tenant
metadata:
  name: s3
  namespace: object-storage
spec:
  # Root login from root-credentials.yaml (OpenBao via ESO)
  configuration:
    name: s3-env
  pools:
    # Lab: one server with 4 small drives (erasure coding needs at least 4)
    - name: pool-0
      servers: 1
      volumesPerServer: 4
      volumeClaimTemplate:
        metadata:
          name: data
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
  buckets:
    - name: thanos
    - name: loki
  # Lab: plain HTTP inside the cluster. Production: TLS (certificate from the corporate CA).
  requestAutoCert: false
  # No load balancer services: only reached inside the cluster
  exposeServices:
    minio: false
    console: false
