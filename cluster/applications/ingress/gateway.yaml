# The cluster's ingress: one Gateway for all apps, like the default router on OpenShift.
# HTTPRoutes in any namespace attach to it.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: apps
  namespace: openshift-ingress
spec:
  gatewayClassName: openshift-default
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.apps.hub.127.0.0.1.nip.io"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: apps-wildcard-tls
      allowedRoutes:
        namespaces:
          from: All
    # Plain HTTP only exists to redirect to HTTPS (see http-redirect.yaml, later)
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.apps.hub.127.0.0.1.nip.io"
      allowedRoutes:
        namespaces:
          from: Same
