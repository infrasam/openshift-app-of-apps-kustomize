# The cluster's ingress: one Gateway for all apps, like the default router on OpenShift.
# HTTPRoutes in any namespace attach to it.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: apps
  namespace: openshift-ingress
spec:
  gatewayClassName: openshift-default
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.apps.hub.127.0.0.1.nip.io"
      tls:
        mode: Terminate
        certificateRefs:
          # group "" (core API) is set by the API server; written out so Argo CD sees no diff
          - group: ""
            kind: Secret
            name: apps-wildcard-tls
      allowedRoutes:
        namespaces:
          from: All
    # TLS passthrough: the backend terminates TLS with its own certificate
    # (OpenShift: a Route with termination: passthrough). The exact hostname wins
    # over the wildcard above on the same port.
    - name: tls-passthrough-openbao
      protocol: TLS
      port: 443
      hostname: openbao.apps.hub.127.0.0.1.nip.io
      tls:
        mode: Passthrough
      allowedRoutes:
        namespaces:
          from: All
        kinds:
          - kind: TLSRoute
    # Plain HTTP only exists to redirect to HTTPS (see http-redirect.yaml)
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.apps.hub.127.0.0.1.nip.io"
      allowedRoutes:
        namespaces:
          from: Same
