# Every plain-HTTP request is redirected to HTTPS (OpenShift Route: insecureEdgeTerminationPolicy: Redirect).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https
  namespace: openshift-ingress
spec:
  parentRefs:
    - name: apps
      sectionName: http
  hostnames:
    - "*.apps.hub.127.0.0.1.nip.io"
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
