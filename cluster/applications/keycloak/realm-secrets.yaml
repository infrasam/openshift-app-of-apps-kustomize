# Values the realm import (realm-lab.yaml) fills in: the first user's password and the
# OIDC client secrets of the applications. From OpenBao, clusters/k3d-hub-01/keycloak.
# The applications read their own client secret from the same OpenBao path.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: realm-secrets
  namespace: keycloak
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: realm-secrets
  dataFrom:
    - extract:
        key: clusters/k3d-hub-01/keycloak
