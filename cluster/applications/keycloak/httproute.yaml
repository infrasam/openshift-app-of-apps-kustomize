# Keycloak's login pages and OIDC endpoints through the cluster Gateway (OpenShift: a Route).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
  namespace: keycloak
spec:
  parentRefs:
    - name: apps
      namespace: openshift-ingress
      sectionName: https
  hostnames:
    - keycloak.apps.hub.172.19.0.3.nip.io
  rules:
    - backendRefs:
        - name: keycloak-service
          port: 8080
