# Demo: a value that only exists in OpenBao (secret/shared/demo) becomes a Kubernetes Secret.
# Git holds only this reference, never the value.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: demo-credentials
  namespace: secret-demo
spec:
  # Short for the demo, so a change in OpenBao shows up quickly (production: e.g. 1h)
  refreshInterval: 30s
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: demo-credentials
  data:
    - secretKey: username
      remoteRef:
        key: shared/demo
        property: username
    - secretKey: password
      remoteRef:
        key: shared/demo
        property: password
