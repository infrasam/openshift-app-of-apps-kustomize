# Defined once on the hub: ESO creates the Secret "pull-secret" in every namespace labelled
# managed-cluster=true (one namespace per spoke). Same pattern as vCenter credentials and the
# Red Hat pull secret for Hive in production.
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: pull-secret
spec:
  externalSecretName: pull-secret
  namespaceSelectors:
    - matchLabels:
        platform.example.internal/managed-cluster: "true"
  refreshTime: 1m
  externalSecretSpec:
    refreshInterval: 1h
    secretStoreRef:
      kind: ClusterSecretStore
      name: openbao
    target:
      name: pull-secret
      template:
        type: kubernetes.io/dockerconfigjson
    data:
      - secretKey: .dockerconfigjson
        remoteRef:
          key: shared/pull-secret
          property: dockerconfigjson
