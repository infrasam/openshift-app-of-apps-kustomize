# External Secrets Operator on every cluster: turns ExternalSecret objects into Secrets,
# with the values fetched from OpenBao (production: the corporate Vault).
# Helm instead of OLM on purpose: the operatorhubio package is stuck at v0.11 with the old
# v1beta1 API. Production uses the "External Secrets Operator for Red Hat OpenShift" (OLM),
# which serves the same external-secrets.io/v1 API as this chart.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: openshift-gitops
  annotations:
    # After cert-manager (-3) and lab-ca (-2), before anything that consumes secrets
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.11.0
    helm:
      valuesObject:
        installCRDs: true
        # Lab: small footprint for the controller, webhook and cert controller
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
        webhook:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
        certController:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The CRDs are too large for client-side apply
      - ServerSideApply=true
