apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  project: default
  source:
    repoURL: https://redhat-cop.github.io/helm-charts
    chart: gitops-operator
    targetRevision: 0.10.6
    helm:
      # Plain-text values instead of valuesObject: Kubernetes strips null fields from
      # stored objects, and the nulls below are needed to remove chart defaults.
      values: |
        name: argocd
        ignoreHelmHooks: true
        namespaces:
          - openshift-gitops
        teamInstancesAreClusterScoped: true
        operator:
          name: argocd-operator
          namespace: operators
          channel: alpha
          version: argocd-operator.v0.19.0
          installPlanApproval: Automatic
          sourceName: operatorhubio-catalog
          sourceNamespace: olm
          disableDefaultArgoCD: true
        argocd_cr:
          initialRepositories: null
          resourceExclusions: null
          repositoryCredentials: null
          sso: null
          rbac:
            defaultPolicy: role:readonly
            policy: ""
            scopes: "[groups]"
          # Diff on the API server (like kubectl diff): defaulted fields no longer show as OutOfSync
          cmdParams:
            controller.diff.server.side: "true"
          server:
            route:
              enabled: false   # Route CRD does not exist on k3d
            # TLS ends at the Gateway (like an edge Route): Argo CD serves plain HTTP inside
            insecure: true
          resourceHealthChecks:
            # Required for sync-waves between Applications (app-of-apps ordering)
            - group: argoproj.io
              kind: Application
              check: |
                hs = {}
                hs.status = "Progressing"
                hs.message = ""
                if obj.status ~= nil and obj.status.health ~= nil then
                  hs.status = obj.status.health.status
                  if obj.status.health.message ~= nil then
                    hs.message = obj.status.health.message
                  end
                end
                return hs
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
