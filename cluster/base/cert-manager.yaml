# cert-manager on every cluster: issues and renews TLS certificates.
# Installed as an OLM operator, like on OpenShift (see applications/cert-manager/).
# The ClusterIssuer/Certificate API is the same in the lab and in production.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: openshift-gitops
  annotations:
    # After Argo CD (-5), before anything that requests certificates
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: default
  source:
    repoURL: https://github.com/infrasam/openshift-app-of-apps-kustomize.git
    targetRevision: main
    path: cluster/applications/cert-manager
  destination:
    # The Subscription sets its own namespace (operators)
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
